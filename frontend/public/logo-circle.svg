<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#d4af37" stroke-width="8"/>

  <!-- Inner Circle Background -->
  <circle cx="100" cy="100" r="90" fill="white"/>

  <!-- Gift Box -->
  <g transform="translate(100, 70)">
    <!-- Left box side -->
    <rect x="-30" y="10" width="25" height="35" fill="none" stroke="#d4af37" stroke-width="2.5" rx="2"/>
    <!-- Right box side -->
    <rect x="5" y="10" width="25" height="35" fill="none" stroke="#d4af37" stroke-width="2.5" rx="2"/>
    <!-- Box divider -->
    <line x1="-5" y1="10" x2="-5" y2="45" stroke="#d4af37" stroke-width="2.5"/>

    <!-- Ribbon bow - left loop -->
    <path d="M -35 8 Q -45 0 -40 -10 Q -35 -5 -30 8" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ribbon bow - right loop -->
    <path d="M 35 8 Q 45 0 40 -10 Q 35 -5 30 8" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ribbon bow - center heart -->
    <path d="M -8 -8 Q -8 -15 -3 -18 Q 0 -16 3 -18 Q 8 -15 8 -8 Q 8 -2 0 4 Q -8 -2 -8 -8" fill="#d4af37"/>
  </g>

  <!-- Infinity symbol at bottom -->
  <g transform="translate(100, 130)">
    <path d="M -25 0 Q -35 -12 -20 -20 Q 0 -25 5 -15 Q 10 -25 20 -20 Q 35 -12 25 0 Q 35 12 20 20 Q 0 25 -5 15 Q -10 25 -20 20 Q -35 12 -25 0"
          fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>