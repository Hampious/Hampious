<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f4f6" />

    <!-- Primary SEO -->
    <title>Hampious — Premium Gift Hampers & Luxury Gifting</title>
    <meta name="description" content="Hampious offers premium luxury gift hampers for birthdays, weddings, corporate gifting, festive celebrations, and special occasions. Elegant, curated, and delivered with care." />
    <meta name="keywords" content="gift hampers, luxury hampers, corporate gifts, birthday hampers, wedding gifts, festive hampers, premium gifting, hampious" />
    <meta name="author" content="Hampious" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hampious.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/hampious-logo.svg" />
    <link rel="icon" type="image/jpeg" href="%PUBLIC_URL%/logo.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.jpg" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:title" content="Hampious — Premium Gift Hampers & Luxury Gifting" />
    <meta property="og:description" content="Discover luxury gift hampers curated for every occasion. Hampious brings elegance, quality, and premium gifting experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hampious.com/" />
    <meta property="og:image" content="https://hampious.com/seo-preview.jpg" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hampious — Premium Gift Hampers & Luxury Gifting" />
    <meta name="twitter:description" content="Luxury gift hampers curated for birthdays, weddings, corporate gifting, and premium occasions." />
    <meta name="twitter:image" content="https://hampious.com/seo-preview.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Manifest -->
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
