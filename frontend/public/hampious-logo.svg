<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle Border -->
  <circle cx="100" cy="120" r="95" fill="none" stroke="#d4af37" stroke-width="6"/>

  <!-- Gift Box Body -->
  <g id="gift-box">
    <!-- Left box -->
    <rect x="60" y="60" width="30" height="50" fill="none" stroke="#d4af37" stroke-width="2.5" rx="1"/>
    <!-- Right box -->
    <rect x="110" y="60" width="30" height="50" fill="none" stroke="#d4af37" stroke-width="2.5" rx="1"/>

    <!-- Center divider -->
    <line x1="90" y1="60" x2="90" y2="110" stroke="#d4af37" stroke-width="2"/>
    <line x1="110" y1="60" x2="110" y2="110" stroke="#d4af37" stroke-width="2"/>
  </g>

  <!-- Bow/Ribbon Top -->
  <g id="bow">
    <!-- Left loop -->
    <path d="M 75 55 Q 70 40 80 35 Q 85 45 90 50" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right loop -->
    <path d="M 125 55 Q 130 40 120 35 Q 115 45 110 50" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center knot -->
    <circle cx="100" cy="50" r="3" fill="#d4af37"/>
    <!-- Vertical ribbon -->
    <line x1="100" y1="50" x2="100" y2="110" stroke="#d4af37" stroke-width="1.5"/>
  </g>

  <!-- Infinity Symbol Below Gift -->
  <g id="infinity">
    <path d="M 70 140 Q 80 130 100 140 Q 120 150 130 140 Q 140 130 150 140"
          fill="none" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Heart Symbol Overlay -->
  <g id="heart" transform="translate(100, 165)">
    <path d="M 0,-5 C -8,-13 -15,-10 -15,-2 C -15,8 0,18 0,18 C 0,18 15,8 15,-2 C 15,-10 8,-13 0,-5"
          fill="#d4af37" stroke="#d4af37" stroke-width="0.5"/>
  </g>

  <!-- Text: HAMPIOUS -->
  <text x="100" y="230" font-family="'Georgia', 'Garamond', serif" font-size="28" font-weight="bold"
        fill="#d4af37" text-anchor="middle" letter-spacing="3">HAMPIOUS</text>

  <!-- Tagline: Delivered with love -->
  <text x="100" y="260" font-family="'Brush Script MT', 'Lucida Handwriting', cursive" font-size="13"
        fill="#d4af37" text-anchor="middle" font-style="italic" letter-spacing="1">Delivered with love</text>
</svg>
